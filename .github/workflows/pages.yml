# Publica o painel no GitHub Pages. Não há build: o site é o próprio
# repositório, servido como está.
#
# PRÉ-REQUISITO, uma vez: em Settings → Pages, a origem tem de estar em
# "GitHub Actions".
name: Publicar painel

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Artefato e deploy em jobs separados: no mesmo job, o deploy-pages às vezes
  # consulta o artefato antes de a API o listar ("Found 0 artifact(s)").
  empacota:
    name: Empacotar
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: .

  publica:
    name: Publicar
    needs: empacota
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
