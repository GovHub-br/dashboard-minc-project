<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Painéis do Gov Hub no Ministério da Cultura</title>
  <!-- A raiz abre o trabalho nos 8 eixos. O painel do TED mora em ted.html.

       Até 22/09/2026 o TED ficava aqui, e há links para ele com âncora
       (index.html#produtos, #metas…). Os ids das seções do TED não se
       repetem no painel dos eixos, então a âncora diz para onde o link ia:
       se é do TED, segue para ted.html; senão, para os eixos. -->
  <meta http-equiv="refresh" content="0; url=eixos.html">
  <link rel="icon" href="assets/marca/borboleta.svg" type="image/svg+xml">
  <script>
    (function () {
      var DO_TED = ['produtos', 'indicadores', 'metas', 'evolucao',
                    'artefatos', 'cronograma', 'documentos'];
      var ancora = location.hash.slice(1);
      var destino = DO_TED.indexOf(ancora) >= 0 ? 'ted.html' : 'eixos.html';
      location.replace(destino + location.hash);
    })();
  </script>
</head>
<body>
  <p>
    <a href="eixos.html">Trabalho nos 8 eixos</a> ·
    <a href="ted.html">Entregas do TED</a>
  </p>
</body>
</html>
